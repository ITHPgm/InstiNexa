<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a60043">
<title>InstiNexa — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--wine:#a60043;--wine-deep:#830033;--pink:#f8e5ee;--navy:#07182e;--ink:#10213d;--blue:#426d9e;--muted:#6b7f98;--line:#e7eaf2;--glass:rgba(255,255,255,.78);--shadow:0 22px 70px rgba(74,12,45,.16)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px 12px;background:radial-gradient(ellipse at 10% 15%,#f4d5e5 0,transparent 34%),radial-gradient(ellipse at 90% 65%,#f8d8e8 0,transparent 36%),linear-gradient(145deg,#fff9fc,#f6e8f0 55%,#fff);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button{font:inherit;cursor:pointer}
.phone{position:relative;width:min(100%,760px);height:min(1500px,calc(100dvh - 40px));min-height:760px;overflow:hidden;border-radius:57px;border:2px solid rgba(255,255,255,.9);background:linear-gradient(160deg,rgba(255,255,255,.94),rgba(255,255,255,.82));box-shadow:0 28px 85px rgba(80,20,52,.24),inset 0 0 0 5px rgba(255,255,255,.35);animation:appear .7s cubic-bezier(.2,.8,.2,1) both}
.statusbar{height:65px;display:flex;align-items:center;justify-content:space-between;padding:12px 44px 0;font-weight:800;font-size:17px;position:relative;z-index:3}
.status-icons{display:flex;align-items:center;gap:7px;font-size:16px}
.app-header{display:flex;align-items:center;gap:16px;padding:10px 32px 14px}
.back-btn,.header-icon{border:0;display:grid;place-items:center;flex-shrink:0}
.back-btn{width:30px;height:44px;background:transparent;color:var(--navy);font-size:25px}
.brand{display:flex;align-items:center;gap:13px;min-width:0;flex:1}
.brand-icon{height:62px;width:62px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#d82069,#850034);border:3px solid #e64c88;color:white;font-size:25px;box-shadow:0 8px 18px #a6004328}
.brand-title{font-size:27px;line-height:1.08;font-weight:800;letter-spacing:-.7px;white-space:nowrap}.brand-title span{color:#bf0c52}
.brand-sub{font-size:12px;color:#31537d;margin-top:5px}
.header-tools{display:flex;gap:12px;align-items:center}
.header-icon{width:58px;height:58px;border-radius:50%;background:rgba(239,241,249,.9);color:var(--navy);font-size:23px;position:relative;transition:transform .2s,background .2s}
.header-icon:hover{transform:translateY(-2px);background:#f8e3ed}
.header-icon.bell{background:rgba(251,228,239,.92);color:var(--wine)}
.badge-count{position:absolute;top:-3px;right:-2px;min-width:26px;height:26px;border-radius:50%;padding:0 5px;background:#bd064c;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid white}
.content-scroll{height:calc(100% - 220px);overflow-y:auto;padding:10px 32px 24px;scrollbar-width:none}
.content-scroll::-webkit-scrollbar{display:none}
.heading-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:7px}
h1{font-size:clamp(30px,4.5vw,40px);letter-spacing:-1.25px;line-height:1.1;margin:0;font-weight:800}
.mark-read{border:1px solid #efc9da;border-radius:999px;background:rgba(255,244,249,.8);color:var(--wine);font-size:12px;font-weight:700;white-space:nowrap;padding:13px 16px;display:flex;align-items:center;gap:9px;transition:background .2s,transform .2s}
.mark-read:hover{background:#fae2ec;transform:translateY(-1px)}
.intro{font-size:17px;line-height:1.55;color:var(--blue);margin:13px 0 27px;max-width:500px}
.filters{display:flex;gap:10px;overflow-x:auto;padding:3px 0 5px;margin-bottom:20px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter{height:55px;padding:0 20px;border-radius:999px;border:1px solid #e4e8f2;background:rgba(247,248,252,.72);color:#4c72a0;font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:12px;transition:all .2s}
.filter .count{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#f9e9f0;color:var(--wine);border:1px solid #efbfd3;font-size:12px;font-weight:800}
.filter.active{background:linear-gradient(100deg,#a60043,#b50a50);border-color:transparent;color:white;box-shadow:0 7px 16px #a6004320}
.filter.active .count{background:white;color:var(--wine);border-color:white}
.notifications{display:flex;flex-direction:column;gap:14px;padding-bottom:24px}
.notification{width:100%;min-height:120px;text-align:left;display:grid;grid-template-columns:78px minmax(0,1fr) auto;align-items:center;gap:17px;padding:20px 20px;border:1px solid #e6eaf3;border-radius:24px;background:rgba(255,255,255,.63);box-shadow:0 5px 18px rgba(34,46,74,.025);transition:transform .2s,border-color .2s,background .2s;animation:rise .45s both}
.notification:hover{transform:translateY(-2px);border-color:#edc4d6;background:rgba(255,255,255,.9)}
.notification.unread{background:linear-gradient(105deg,rgba(253,239,246,.95),rgba(255,250,253,.82));border-color:#f3e3ec}
.notification.read{opacity:.78}
.notification-icon{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font-size:28px;flex-shrink:0}
.notification-icon.wine{background:linear-gradient(145deg,#b90b4e,#8e0037);color:#fff}
.notification-icon.pink{background:#fbe4ee;color:#a90043}
.notification-icon.blue{background:#e1e7ff;color:#173f9b}
.notification-icon.green{background:#d9f7ed;color:#087452}
.notification-icon.purple{background:#eadbff;color:#5b20a4}
.notification-copy{min-width:0}
.notification-copy strong{font-size:16px;line-height:1.35;display:block;font-weight:800;color:#09234c;margin-bottom:7px}
.notification-copy p{font-size:14px;line-height:1.55;color:#47709f;margin:0}
.notification-meta{height:100%;min-width:54px;display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;gap:18px;color:#5277a1;font-size:12px;white-space:nowrap;padding-top:2px}
.unread-dot{width:11px;height:11px;border-radius:50%;background:#d60051;display:block;margin-right:4px}
.notification.read .unread-dot{background:transparent}
.empty-state{display:none;text-align:center;padding:55px 20px;color:var(--muted)}
.empty-state i{font-size:38px;color:#d9a4bd;margin-bottom:15px}.empty-state strong{display:block;color:var(--ink);margin-bottom:8px}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:137px;z-index:5;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:15px 25px 28px;border-radius:35px 35px 0 0;background:rgba(4,20,41,.98);box-shadow:0 -8px 30px rgba(7,24,46,.13)}
.nav-item{border:0;background:transparent;color:#d6deeb;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-width:0;font-size:12px;transition:color .2s,transform .2s}
.nav-item i{font-size:26px}.nav-item span{font-size:12px}
.nav-item.active{color:#fff}.nav-item.active:not(.map-tab){color:#f21b76}
.nav-item.map-tab{transform:translateY(-18px);gap:8px}
.map-orb{width:80px;height:80px;display:grid;place-items:center;border-radius:50%;font-size:31px;color:#fff;background:linear-gradient(145deg,#e31c70,#9e003e);border:4px solid #f3b5d0;box-shadow:0 8px 22px #a600435a}
.nav-item.map-tab span:last-child{font-weight:700;color:white}
.home-indicator{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:190px;height:5px;border-radius:99px;background:#e6edf6;z-index:7}
.toast{position:fixed;z-index:30;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#07182e;color:#fff;border-radius:15px;padding:13px 18px;max-width:90vw;text-align:center;font-size:13px;box-shadow:0 12px 30px #00142c3b;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes appear{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:650px){body{padding:0;background:#fff}.phone{width:100%;height:100dvh;min-height:650px;border:0;border-radius:0;box-shadow:none}.statusbar{height:54px;padding:8px 25px 0}.app-header{padding:8px 17px 12px;gap:8px}.back-btn{width:24px;font-size:22px}.brand{gap:9px}.brand-icon{width:49px;height:49px;font-size:20px}.brand-title{font-size:22px}.brand-sub{font-size:10px;margin-top:3px}.header-tools{gap:7px}.header-icon{width:43px;height:43px;font-size:18px}.badge-count{min-width:22px;height:22px;font-size:10px}.content-scroll{height:calc(100% - 191px);padding:8px 18px 20px}.heading-row{align-items:flex-start;gap:8px}h1{font-size:30px;letter-spacing:-.9px}.mark-read{font-size:10px;padding:10px 11px;gap:6px;margin-top:1px}.intro{font-size:14px;line-height:1.5;margin:12px 0 20px}.filters{gap:8px;margin-bottom:15px}.filter{height:47px;padding:0 15px;font-size:12px;gap:8px}.filter .count{width:23px;height:23px;font-size:10px}.notifications{gap:11px}.notification{min-height:105px;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:15px 13px;border-radius:19px}.notification-icon{width:49px;height:49px;font-size:21px}.notification-copy strong{font-size:13px;margin-bottom:5px}.notification-copy p{font-size:11px;line-height:1.5}.notification-meta{min-width:43px;font-size:10px;gap:15px}.unread-dot{width:9px;height:9px;margin-right:2px}.bottom-nav{height:103px;padding:10px 9px 23px;border-radius:27px 27px 0 0}.nav-item{gap:7px}.nav-item i{font-size:21px}.nav-item span{font-size:10px}.nav-item.map-tab{transform:translateY(-14px)}.map-orb{width:63px;height:63px;font-size:24px;border-width:3px}.home-indicator{width:120px;bottom:7px}}
@media(max-width:380px){.app-header{padding-left:12px;padding-right:12px}.brand-title{font-size:19px}.brand-icon{width:43px;height:43px}.header-icon{width:37px;height:37px}.content-scroll{padding-left:12px;padding-right:12px}.heading-row{flex-direction:column;align-items:flex-start}.mark-read{align-self:flex-end;margin-top:-4px}.notification{grid-template-columns:44px minmax(0,1fr) auto;gap:9px;padding:12px 10px}.notification-icon{width:42px;height:42px;font-size:18px}.notification-copy strong{font-size:12px}.notification-copy p{font-size:10px}.notification-meta{font-size:9px;min-width:36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="phone" aria-label="InstiNexa notifications">
  <div class="statusbar"><span>9:41</span><span class="status-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div>
  <header class="app-header">
    <button class="back-btn" aria-label="Go back" type="button" data-toast="Connect this button to the previous page."><i class="fa-solid fa-chevron-left"></i></button>
    <a class="brand" href="#" aria-label="InstiNexa home">
      <span class="brand-icon"><i class="fa-solid fa-location-dot"></i></span>
      <span><span class="brand-title">Insti<span>Nexa</span></span><span class="brand-sub" style="display:block">LAUTECH · Ogbomoso</span></span>
    </a>
    <div class="header-tools">
      <button class="header-icon" type="button" aria-label="Search notifications" data-toast="Notification search can be connected here."><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="header-icon bell" type="button" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span class="badge-count" id="headerCount">6</span></button>
    </div>
  </header>

  <div class="content-scroll">
    <div class="heading-row">
      <h1>Notifications</h1>
      <button class="mark-read" id="markAllRead" type="button"><i class="fa-solid fa-check"></i> Mark all as read</button>
    </div>
    <p class="intro">Stay updated with the latest news, events and important announcements from LAUTECH.</p>

    <div class="filters" role="tablist" aria-label="Filter notifications">
      <button class="filter active" type="button" role="tab" aria-selected="true" data-filter="all">All <span class="count" id="allCount">6</span></button>
      <button class="filter" type="button" role="tab" aria-selected="false" data-filter="unread">Unread <span class="count" id="unreadCount">6</span></button>
      <button class="filter" type="button" role="tab" aria-selected="false" data-filter="announcements">Announcements <span class="count" id="announcementCount">3</span></button>
      <button class="filter" type="button" role="tab" aria-selected="false" data-filter="events">Events</button>
    </div>

    <section class="notifications" id="notificationList" aria-label="Notification list">
      <button class="notification unread" type="button" data-category="announcements" data-id="1">
        <span class="notification-icon wine"><i class="fa-solid fa-bullhorn"></i></span>
        <span class="notification-copy"><strong>Important Announcement</strong><p>LAUTECH academic calendar for the 2025/2026 session has been released. Check the details...</p></span>
        <span class="notification-meta"><time>2h ago</time><span class="unread-dot"></span></span>
      </button>
      <button class="notification unread" type="button" data-category="events" data-id="2">
        <span class="notification-icon pink"><i class="fa-regular fa-calendar-days"></i></span>
        <span class="notification-copy"><strong>Event Reminder</strong><p>Tech &amp; Innovation Summit 2025 will hold on Oct 15, 2025 at the Main Auditorium.</p></span>
        <span class="notification-meta"><time>4h ago</time><span class="unread-dot"></span></span>
      </button>
      <button class="notification unread" type="button" data-category="courses" data-id="3">
        <span class="notification-icon blue"><i class="fa-solid fa-graduation-cap"></i></span>
        <span class="notification-copy"><strong>New Course Available</strong><p>A new course “Artificial Intelligence Basics” has been added to the Learn Hub.</p></span>
        <span class="notification-meta"><time>6h ago</time><span class="unread-dot"></span></span>
      </button>
      <button class="notification unread" type="button" data-category="announcements" data-id="4">
        <span class="notification-icon pink"><i class="fa-solid fa-book-open"></i></span>
        <span class="notification-copy"><strong>Library Update</strong><p>The Central Library will be closed on Saturday, Oct 4, 2025 for maintenance.</p></span>
        <span class="notification-meta"><time>8h ago</time><span class="unread-dot"></span></span>
      </button>
      <button class="notification unread" type="button" data-category="announcements" data-id="5">
        <span class="notification-icon green"><i class="fa-solid fa-users"></i></span>
        <span class="notification-copy"><strong>Student Notice</strong><p>All students are advised to complete their course registration before the deadline.</p></span>
        <span class="notification-meta"><time>10h ago</time><span class="unread-dot"></span></span>
      </button>
      <button class="notification unread" type="button" data-category="security" data-id="6">
        <span class="notification-icon purple"><i class="fa-solid fa-shield-halved"></i></span>
        <span class="notification-copy"><strong>Security Alert</strong><p>Be vigilant and avoid sharing your login details with anyone. Your account security is important.</p></span>
        <span class="notification-meta"><time>12h ago</time><span class="unread-dot"></span></span>
      </button>
      <button class="notification read" type="button" data-category="announcements" data-id="7">
        <span class="notification-icon pink"><i class="fa-solid fa-bullhorn"></i></span>
        <span class="notification-copy"><strong>Campus News</strong><p>New hostel blocks (B and C) are now open for accommodation booking.</p></span>
        <span class="notification-meta"><time>1d ago</time><span class="unread-dot"></span></span>
      </button>
    </section>
    <div class="empty-state" id="emptyState"><i class="fa-regular fa-bell-slash"></i><strong>No notifications here</strong><span>You're all caught up in this section.</span></div>
  </div>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button class="nav-item" type="button" data-nav="Home"><i class="fa-solid fa-house-chimney"></i><span>Home</span></button>
    <button class="nav-item" type="button" data-nav="Explore"><i class="fa-regular fa-compass"></i><span>Explore</span></button>
    <button class="nav-item map-tab" type="button" data-nav="Map"><span class="map-orb"><i class="fa-solid fa-location-dot"></i></span><span>Map</span></button>
    <button class="nav-item" type="button" data-nav="Facilities"><i class="fa-solid fa-layer-group"></i><span>Facilities</span></button>
    <button class="nav-item" type="button" data-nav="Profile"><i class="fa-regular fa-id-card"></i><span>Profile</span></button>
  </nav>
  <div class="home-indicator" aria-hidden="true"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=> {
  const list=document.getElementById('notificationList');
  const items=[...list.querySelectorAll('.notification')];
  const filters=[...document.querySelectorAll('[data-filter]')];
  const toast=document.getElementById('toast');
  let timer;
  function notify(message){toast.textContent=message;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2500)}
  function updateCounts(){
    const unread=items.filter(n=>n.classList.contains('unread'));
    document.getElementById('headerCount').textContent=unread.length;
    document.getElementById('unreadCount').textContent=unread.length;
    document.getElementById('allCount').textContent=items.length;
    document.getElementById('announcementCount').textContent=items.filter(n=>n.dataset.category==='announcements').length;
    document.getElementById('headerCount').style.display=unread.length?'grid':'none';
  }
  function applyFilter(filter){
    let visible=0;
    items.forEach(item=>{
      const matches=filter==='all'||(filter==='unread'&&item.classList.contains('unread'))||item.dataset.category===filter;
      item.style.display=matches?'grid':'none';
      if(matches)visible++;
    });
    document.getElementById('emptyState').style.display=visible?'none':'block';
  }
  filters.forEach(button=>button.addEventListener('click',()=>{
    filters.forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-selected',b===button?'true':'false')});
    applyFilter(button.dataset.filter);
  }));
  items.forEach(item=>item.addEventListener('click',()=>{
    const wasUnread=item.classList.contains('unread');
    item.classList.remove('unread');item.classList.add('read');
    updateCounts();
    if(wasUnread)notify('Notification marked as read.');
    else notify('Notification opened. Connect this item to its details page.');
  }));
  document.getElementById('markAllRead').addEventListener('click',()=>{
    items.forEach(item=>{item.classList.remove('unread');item.classList.add('read')});
    updateCounts();applyFilter(document.querySelector('.filter.active').dataset.filter);
    notify('All notifications marked as read.');
  });
  document.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',()=>notify(el.dataset.toast)));
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>notify(el.dataset.nav+' tab selected — connect to your app route.')));
  updateCounts();
})();
</script>
</body>
</html>
