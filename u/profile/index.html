
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07182e">
<title>InstiNexa | Student Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
    --wine: #a60043;
    --pink: #ed2876;
    --navy: #07182e;
    --ink: #102341;
    --muted: #647894;
    --border: rgba(216, 222, 236, .75);
    --glass: rgba(255, 255, 255, .78);
    --shadow: 0 12px 32px rgba(32, 34, 65, .07);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px 12px;
    color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
    background:
        radial-gradient(ellipse at 5% 10%, #f3d4e2, transparent 35%),
        radial-gradient(ellipse at 95% 80%, #f7dce9, transparent 34%),
        linear-gradient(145deg, #fffafd, #f7edf3);
}

button {
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.phone {
    position: relative;
    width: min(100%, 760px);
    height: min(1600px, calc(100dvh - 40px));
    min-height: 780px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,.9);
    border-radius: 54px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 28px 85px rgba(80,20,52,.2);
    animation: pageEnter .7s ease both;
}

/* Campus header */

.status-bar {
    position: absolute;
    z-index: 4;
    top: 0;
    left: 0;
    right: 0;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 40px 0;
    color: white;
    font-size: 16px;
    font-weight: 800;
    text-shadow: 0 1px 5px #10142d88;
}

.status-icons {
    display: flex;
    gap: 8px;
    align-items: center;
}

.cover {
    height: 280px;
    padding: 72px 30px 0;
    position: relative;
    color: white;
    background:
        linear-gradient(90deg, rgba(24,6,35,.84), rgba(30,9,39,.42) 62%, rgba(15,8,25,.1)),
        linear-gradient(0deg, rgba(8,15,37,.45), transparent 75%),
        url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1500&q=85")
        center 43% / cover;
    clip-path: ellipse(110% 100% at 48% 0%);
}

.header {
    display: flex;
    align-items: center;
    gap: 13px;
}

.brand-mark {
    flex-shrink: 0;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: white;
    font-size: 27px;
    background: linear-gradient(145deg, #f13a80, #870034);
    border: 3px solid #f46a9c;
    box-shadow: 0 8px 22px #5b001c55;
}

.brand-name {
    font-size: 26px;
    line-height: 1.1;
    font-weight: 800;
    letter-spacing: -.7px;
}

.brand-name span {
    color: #ff327e;
}

.brand-subtitle {
    margin-top: 5px;
    font-size: 11px;
    color: #fff;
}

.header-actions {
    margin-left: auto;
    display: flex;
    gap: 10px;
}

.header-action {
    position: relative;
    width: 49px;
    height: 49px;
    display: grid;
    place-items: center;
    border: 1px solid #ffffff35;
    border-radius: 50%;
    color: white;
    font-size: 20px;
    background: rgba(255,255,255,.17);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    transition: transform .2s, background .2s;
}

.header-action:active {
    transform: scale(.93);
    background: rgba(255,255,255,.35);
}

.notification-count {
    position: absolute;
    top: -3px;
    right: -2px;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    border: 2px solid white;
    border-radius: 50%;
    background: var(--pink);
    font-size: 10px;
    font-weight: 800;
}

/* Scrollable profile content */

.main-content {
    position: absolute;
    top: 226px;
    bottom: 130px;
    left: 0;
    right: 0;
    padding: 0 28px 25px;
    overflow-y: auto;
    scrollbar-width: none;
}

.main-content::-webkit-scrollbar {
    display: none;
}

/* Student information */

.profile-card {
    display: grid;
    grid-template-columns: 155px minmax(0,1fr) 20px;
    align-items: center;
    gap: 17px;
    padding: 17px;
    border: 1px solid var(--border);
    border-radius: 29px;
    background: var(--glass);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    box-shadow: var(--shadow);
    animation: slideUp .55s .08s both;
}

.avatar-wrap {
    position: relative;
    width: 150px;
    height: 150px;
    padding: 7px;
    border: 2px solid #f0e2ec;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    box-shadow: 0 6px 18px #1c234019;
}

.avatar {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    background: #dbe5ef;
}

.camera-button {
    position: absolute;
    right: -2px;
    bottom: 5px;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border: 3px solid white;
    border-radius: 50%;
    color: white;
    background: linear-gradient(145deg, #b5004b, #820032);
    box-shadow: 0 5px 12px #87003433;
}

.profile-name {
    margin: 0 0 8px;
    font-size: clamp(18px, 3vw, 26px);
    font-weight: 800;
    line-height: 1.2;
    letter-spacing: -.6px;
    overflow-wrap: anywhere;
}

.role-badge {
    display: inline-block;
    margin-bottom: 7px;
    padding: 5px 13px;
    border-radius: 50px;
    color: white;
    background: linear-gradient(100deg, #a60043, #790031);
    font-size: 12px;
    font-weight: 600;
}

.profile-detail {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-top: 5px;
    color: #557394;
    font-size: 12px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.profile-detail i {
    width: 16px;
    margin-top: 2px;
    color: #a72a64;
    text-align: center;
    flex-shrink: 0;
}

.edit-profile {
    align-self: center;
    border: 0;
    padding: 6px 0;
    color: var(--wine);
    background: transparent;
    font-size: 21px;
}

/* Academic overview */

.stats-card {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    margin-top: 16px;
    padding: 16px 5px;
    border: 1px solid var(--border);
    border-radius: 26px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
    animation: slideUp .55s .15s both;
}

.stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 0 4px;
    text-align: center;
    border-right: 1px solid #edc6d7;
}

.stat:last-child {
    border-right: 0;
}

.stat-icon {
    width: 43px;
    height: 43px;
    display: grid;
    place-items: center;
    margin-bottom: 3px;
    border-radius: 50%;
    color: #920039;
    background: linear-gradient(145deg, #fff0f6, #f8dce9);
    font-size: 19px;
}

.stat strong {
    color: #0a1f3f;
    font-size: 20px;
    font-weight: 800;
}

.stat-label {
    color: #557394;
    font-size: 11px;
    line-height: 1.3;
}

/* Menu cards */

.menu-card {
    margin-top: 22px;
    padding: 0 18px;
    border: 1px solid var(--border);
    border-radius: 27px;
    background: rgba(255,255,255,.75);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: var(--shadow);
    animation: slideUp .55s .22s both;
}

.menu-row {
    width: 100%;
    min-height: 76px;
    display: grid;
    grid-template-columns: 50px minmax(0,1fr) 18px;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border: 0;
    border-bottom: 1px solid #e8ebf3;
    color: inherit;
    text-align: left;
    background: transparent;
    transition: opacity .2s, transform .2s;
}

.menu-row:last-child {
    border-bottom: 0;
}

.menu-row:active {
    opacity: .7;
    transform: scale(.99);
}

.menu-icon {
    width: 47px;
    height: 47px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    color: #94003a;
    background: linear-gradient(145deg, #fcecf3, #f7dce8);
    font-size: 20px;
}

.menu-title {
    display: block;
    margin-bottom: 4px;
    color: #102341;
    font-size: 14px;
    font-weight: 750;
}

.menu-description {
    display: block;
    color: #557394;
    font-size: 11px;
    line-height: 1.5;
}

.menu-arrow {
    color: #788eae;
    text-align: right;
    font-size: 15px;
}

/* Sign out */

.logout-card {
    margin: 22px 0 16px;
    overflow: hidden;
    border: 1px solid #f2e0eb;
    border-radius: 25px;
    background: rgba(250,232,241,.78);
}

.logout-button {
    width: 100%;
    min-height: 68px;
    display: grid;
    grid-template-columns: 50px 1fr 18px;
    align-items: center;
    gap: 14px;
    padding: 12px 18px;
    border: 0;
    color: #b40049;
    text-align: left;
    background: transparent;
    font-weight: 700;
}

.logout-button .menu-icon {
    color: #b40049;
    background: rgba(255,255,255,.65);
}

/* Persistent app navigation */

.bottom-nav {
    position: absolute;
    z-index: 5;
    bottom: 0;
    left: 0;
    right: 0;
    height: 132px;
    display: grid;
    grid-template-columns: repeat(5,1fr);
    align-items: center;
    padding: 14px 18px 27px;
    border-radius: 36px 36px 0 0;
    background: rgba(4,20,40,.99);
    box-shadow: 0 -8px 30px rgba(7,24,46,.13);
}

.nav-item {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 0;
    color: #d9e1ef;
    background: transparent;
    transition: color .2s, transform .2s;
}

.nav-item i {
    font-size: 25px;
}

.nav-item span {
    font-size: 12px;
}

.nav-item.active:not(.map-tab) {
    color: #f52d78;
}

.nav-item:active {
    transform: scale(.92);
}

.nav-underline {
    width: 48px;
    height: 3px;
    margin-top: 2px;
    border-radius: 9px;
    background: #ed1971;
}

.map-tab {
    gap: 7px;
    transform: translateY(-17px);
}

.map-orb {
    width: 80px;
    height: 80px;
    display: grid;
    place-items: center;
    border: 4px solid #f5b6d0;
    border-radius: 50%;
    color: white;
    background: linear-gradient(145deg, #f02d79, #a60043);
    box-shadow: 0 8px 22px #a600435a;
    font-size: 29px;
}

.map-tab span:last-child {
    color: white;
    font-weight: 700;
}

.home-indicator {
    position: absolute;
    z-index: 7;
    bottom: 11px;
    left: 50%;
    width: 180px;
    height: 5px;
    border-radius: 99px;
    background: #e6edf6;
    transform: translateX(-50%);
}

/* Feedback toast */

.toast {
    position: fixed;
    z-index: 30;
    bottom: 22px;
    left: 50%;
    width: max-content;
    max-width: 90vw;
    padding: 13px 18px;
    border-radius: 15px;
    color: white;
    background: #07182e;
    box-shadow: 0 12px 30px #00142c3b;
    text-align: center;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, 20px);
    transition: .25s ease;
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

@keyframes pageEnter {
    from { opacity: 0; transform: translateY(15px) scale(.985); }
    to { opacity: 1; transform: none; }
}

@keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Mobile responsive adjustments */

@media (max-width: 650px) {
    body {
        padding: 0;
        background: white;
    }

    .phone {
        width: 100%;
        height: 100dvh;
        min-height: 650px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
    }

    .status-bar {
        height: 54px;
        padding: 8px 24px 0;
    }

    .cover {
        height: 252px;
        padding: 69px 20px 0;
        background-position: center 42%;
    }

    .brand-mark {
        width: 51px;
        height: 51px;
        font-size: 21px;
    }

    .brand-name {
        font-size: 22px;
    }

    .brand-subtitle {
        font-size: 10px;
    }

    .header {
        gap: 10px;
    }

    .header-actions {
        gap: 7px;
    }

    .header-action {
        width: 40px;
        height: 40px;
        font-size: 17px;
    }

    .main-content {
        top: 204px;
        bottom: 101px;
        padding: 0 16px 20px;
    }

    .profile-card {
        grid-template-columns: 94px minmax(0,1fr) 13px;
        gap: 11px;
        min-height: 145px;
        padding: 12px 10px;
        border-radius: 23px;
    }

    .avatar-wrap {
        width: 90px;
        height: 90px;
        padding: 5px;
    }

    .camera-button {
        width: 31px;
        height: 31px;
        font-size: 12px;
        border-width: 2px;
    }

    .profile-name {
        font-size: 16px;
        letter-spacing: -.3px;
        margin-bottom: 5px;
    }

    .role-badge {
        padding: 4px 9px;
        margin-bottom: 3px;
        font-size: 10px;
    }

    .profile-detail {
        gap: 6px;
        margin-top: 4px;
        font-size: 10px;
    }

    .profile-detail i {
        width: 13px;
        font-size: 10px;
    }

    .edit-profile {
        font-size: 17px;
    }

    .stats-card {
        margin-top: 12px;
        padding: 12px 2px;
        border-radius: 21px;
    }

    .stat {
        padding: 0 2px;
    }

    .stat-icon {
        width: 35px;
        height: 35px;
        font-size: 15px;
    }

    .stat strong {
        font-size: 16px;
    }

    .stat-label {
        font-size: 9px;
    }

    .menu-card {
        margin-top: 16px;
        padding: 0 12px;
        border-radius: 22px;
    }

    .menu-row {
        min-height: 65px;
        grid-template-columns: 40px minmax(0,1fr) 14px;
        gap: 10px;
        padding: 10px 0;
    }

    .menu-icon {
        width: 38px;
        height: 38px;
        font-size: 17px;
    }

    .menu-title {
        font-size: 12px;
        margin-bottom: 3px;
    }

    .menu-description {
        font-size: 9px;
    }

    .menu-arrow {
        font-size: 13px;
    }

    .logout-card {
        margin-top: 16px;
        border-radius: 21px;
    }

    .logout-button {
        min-height: 59px;
        grid-template-columns: 40px 1fr 14px;
        gap: 10px;
        padding: 10px 12px;
        font-size: 12px;
    }

    .bottom-nav {
        height: 101px;
        padding: 9px 7px 23px;
        border-radius: 27px 27px 0 0;
    }

    .nav-item {
        gap: 7px;
    }

    .nav-item i {
        font-size: 21px;
    }

    .nav-item span {
        font-size: 10px;
    }

    .map-tab {
        transform: translateY(-14px);
    }

    .map-orb {
        width: 62px;
        height: 62px;
        border-width: 3px;
        font-size: 23px;
    }

    .nav-underline {
        width: 40px;
        height: 2px;
    }

    .home-indicator {
        width: 120px;
        bottom: 7px;
    }
}

@media (max-width: 370px) {
    .cover {
        padding-left: 13px;
        padding-right: 13px;
    }

    .brand-name {
        font-size: 19px;
    }

    .brand-mark {
        width: 44px;
        height: 44px;
    }

    .header-action {
        width: 35px;
        height: 35px;
    }

    .main-content {
        padding-left: 9px;
        padding-right: 9px;
    }

    .profile-card {
        grid-template-columns: 75px minmax(0,1fr) 10px;
        gap: 8px;
        padding: 9px;
    }

    .avatar-wrap {
        width: 73px;
        height: 73px;
    }

    .profile-name {
        font-size: 14px;
    }

    .profile-detail {
        font-size: 9px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="phone" aria-label="InstiNexa profile page">

    <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons">
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </span>
    </div>

    <header class="cover">
        <div class="header">
            <div class="brand-mark">
                <i class="fas fa-location-dot"></i>
            </div>

            <div>
                <div class="brand-name">Insti<span>Nexa</span></div>
                <div class="brand-subtitle">LAUTECH · Ogbomoso</div>
            </div>

            <div class="header-actions">
                <button class="header-action" type="button"
                    aria-label="Notifications"
                    data-message="Your notifications will appear here.">
                    <i class="far fa-bell"></i>
                    <span class="notification-count">6</span>
                </button>

                <button class="header-action" type="button"
                    aria-label="Settings"
                    data-message="Account settings selected.">
                    <i class="fas fa-gear"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="main-content">

        <!-- Student profile card -->
        <section class="profile-card">
            <div class="avatar-wrap">
                <img
                    class="avatar"
                    src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=360&h=360&q=85"
                    alt="Student profile picture">

                <button class="camera-button" type="button"
                    aria-label="Change profile photo"
                    data-message="Connect this button to your profile photo uploader.">
                    <i class="fas fa-camera"></i>
                </button>
            </div>

            <div>
                <h1 class="profile-name">Olabode Ibukunoluwa</h1>
                <span class="role-badge">Student</span>

                <div class="profile-detail">
                    <i class="fas fa-graduation-cap"></i>
                    <span>Computer Science</span>
                </div>

                <div class="profile-detail">
                    <i class="fas fa-building-columns"></i>
                    <span>LAUTECH · Ogbomoso</span>
                </div>

                <div class="profile-detail">
                    <i class="far fa-id-card"></i>
                    <span>Matric No: LAU/CS/2023/001</span>
                </div>
            </div>

            <button class="edit-profile" type="button"
                aria-label="Edit profile"
                data-message="Connect this action to the edit profile page.">
                <i class="fas fa-chevron-right"></i>
            </button>
        </section>

        <!-- Academic statistics -->
        <section class="stats-card" aria-label="Academic overview">
            <div class="stat">
                <span class="stat-icon"><i class="fas fa-book-open"></i></span>
                <strong>12</strong>
                <span class="stat-label">Courses</span>
            </div>

            <div class="stat">
                <span class="stat-icon"><i class="fas fa-file-lines"></i></span>
                <strong>8</strong>
                <span class="stat-label">Tutorials</span>
            </div>

            <div class="stat">
                <span class="stat-icon"><i class="fas fa-users"></i></span>
                <strong>5</strong>
                <span class="stat-label">Team Members</span>
            </div>

            <div class="stat">
                <span class="stat-icon"><i class="fas fa-star"></i></span>
                <strong>3</strong>
                <span class="stat-label">Achievements</span>
            </div>
        </section>

        <!-- Learning shortcuts -->
        <section class="menu-card" aria-label="Learning shortcuts">

            <button class="menu-row" type="button"
                data-message="My Courses selected.">
                <span class="menu-icon"><i class="fas fa-book-open"></i></span>
                <span>
                    <span class="menu-title">My Courses</span>
                    <span class="menu-description">View your enrolled courses and progress</span>
                </span>
                <i class="menu-arrow fas fa-chevron-right"></i>
            </button>

            <button class="menu-row" type="button"
                data-message="My Tutorials selected.">
                <span class="menu-icon"><i class="fas fa-circle-play"></i></span>
                <span>
                    <span class="menu-title">My Tutorials</span>
                    <span class="menu-description">Access saved tutorials and learning resources</span>
                </span>
                <i class="menu-arrow fas fa-chevron-right"></i>
            </button>

            <button class="menu-row" type="button"
                data-message="My Library selected.">
                <span class="menu-icon"><i class="fas fa-book-bookmark"></i></span>
                <span>
                    <span class="menu-title">My Library</span>
                    <span class="menu-description">Browse and manage library resources</span>
                </span>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
    const toast = document.getElementById("toast");
    let toastTimer;

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");

        clearTimeout(toastTimer);

        toastTimer = setTimeout(() => {
            toast.classList.remove("show");
        }, 2500);
    }

    // Profile and menu interactions
    document.querySelectorAll("[data-message]").forEach(button => {
        button.addEventListener("click", () => {
            showToast(button.dataset.message);
        });
    });

    // Bottom navigation active state
    document.querySelectorAll("[data-nav]").forEach(button => {
        button.addEventListener("click", () => {
            document.querySelectorAll("[data-nav]").forEach(item => {
                item.classList.toggle("active", item === button);
            });

            const page = button.dataset.nav;

            if (page === "Profile") {
                showToast("You are viewing your profile.");
            } else {
                showToast(
                    page + " selected. Connect this tab to your app route."
                );
            }
        });
    });

    // Sign-out confirmation
    document.getElementById("signOut").addEventListener("click", () => {
        const confirmed = window.confirm("Are you sure you want to sign out?");

        if (confirmed) {
            showToast("Connect this action to your secure sign-out endpoint.");
        }
    });
})();
</script>
