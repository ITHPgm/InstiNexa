<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#a5003d"><title>Create New Password · InstiNexa</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>
:root{--wine:#a5003d;--wine-dark:#85002f;--pink:#f8dce8;--ink:#102039;--muted:#567087;--line:#e5e8ed;--paper:#fffdfd}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
body{min-height:100vh;background:radial-gradient(ellipse at 0% 0%,#fbeaf1 0,transparent 36%),radial-gradient(ellipse at 100% 100%,#fbeaf1 0,transparent 35%),#fffdfd;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}a{color:var(--wine);text-decoration:none;font-weight:600}
.auth-shell{width:min(100%,410px);min-height:680px;background:rgba(255,255,255,.79);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.9);border-radius:32px;box-shadow:0 18px 55px rgba(83,30,52,.14),0 2px 10px rgba(30,38,54,.05);overflow:hidden;position:relative;animation:pageIn .72s cubic-bezier(.2,.8,.2,1) both}
.auth-content{position:relative;z-index:2;padding:26px 28px 34px}
.status{height:22px;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:14px}
.status-icons{display:flex;gap:5px;align-items:center;font-size:11px}
.back-row{height:28px;display:flex;align-items:center;margin-bottom:12px}
.back{border:0;background:transparent;color:var(--wine);font-size:20px;padding:4px 0;width:32px;text-align:left}
.brand{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 auto 22px}
.brand-mark{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#d10c55,#82002e);border:3px solid #f5c6d8;box-shadow:0 5px 14px #a5003d24;font-size:17px}
.brand-name{font-size:20px;font-weight:800;letter-spacing:-.6px;line-height:1.05}.brand-name span{color:var(--wine)}.brand-sub{font-size:9px;color:#52647a;margin-top:4px}
h1{font-size:23px;letter-spacing:-.6px;line-height:1.22;margin:0 0 7px;font-weight:800} .intro{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 18px}
.field{height:46px;border:1px solid #e3e6eb;background:rgba(255,255,255,.72);box-shadow:inset 0 1px 2px #1a2a3b05;border-radius:14px;display:flex;align-items:center;gap:12px;padding:0 13px;margin:0 0 10px;transition:border-color .2s,box-shadow .2s,transform .2s}
.field:focus-within{border-color:#c83a70;box-shadow:0 0 0 3px #f6d8e4;transform:translateY(-1px)}
.field>i{color:#40536a;font-size:14px;width:15px;text-align:center;flex-shrink:0}
.field input{border:0;outline:0;min-width:0;width:100%;background:transparent;color:var(--ink);font-size:11px}.field input::placeholder{color:#8593a4}
.field .toggle-pass{border:0;background:transparent;color:#506078;padding:5px;font-size:13px}
.primary{width:100%;height:46px;border:0;border-radius:999px;color:white;background:linear-gradient(100deg,#b50045,#920033);box-shadow:0 7px 16px #a5003d20;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px;transition:transform .2s,box-shadow .2s}
.primary:hover{transform:translateY(-2px);box-shadow:0 10px 22px #a5003d32}.primary:active{transform:scale(.985)}
.form-message{display:none;font-size:11px;line-height:1.5;border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff0f4;color:#9b1746}.form-message.show{display:block;animation:fadeUp .3s ease both}
.footnote{text-align:center;font-size:10px;line-height:1.7;color:#7a8a9b;margin:18px 0 0}.terms{text-align:center;font-size:9px;line-height:1.7;color:#718198;margin:14px 0 0}
.decor{position:absolute;pointer-events:none;z-index:0}.decor.top{width:140px;height:140px;right:-66px;top:-56px;background:linear-gradient(140deg,#f8dce8aa,#fceef4aa);border-radius:42% 58% 60% 40%}.decor.bottom-left{width:180px;height:78px;left:-55px;bottom:-35px;background:linear-gradient(120deg,#a5003d,#cf3474);border-radius:48% 52% 0 0;transform:rotate(13deg)}.decor.bottom-right{width:160px;height:70px;right:-55px;bottom:-35px;background:#f5a2c4;border-radius:60% 40% 0 0;transform:rotate(-18deg)}
/* Login screen hero */
.login-hero{height:235px;position:relative;overflow:hidden;color:white;padding:18px 27px 28px;background:#330a24}
.login-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 42%}.login-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(49,0,27,.9),rgba(77,0,36,.56) 48%,rgba(40,0,24,.08))}
.login-hero .status,.login-hero .brand,.hero-copy{position:relative;z-index:1}.login-hero .brand{justify-content:flex-start;margin:26px 0 25px}.login-hero .brand-sub{color:#f8e8ef}.hero-copy{font-size:16px;line-height:1.42;font-weight:700;letter-spacing:-.2px}.hero-copy span{color:#f43f83}
.login-body{padding:22px 27px 30px;position:relative;z-index:2;margin-top:-20px;background:rgba(255,255,255,.96);border-radius:30px 30px 0 0}
.login-body h1{font-size:21px}.login-body .intro{margin-bottom:16px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:10px;margin:3px 0 16px;color:#607086}
.remember{display:flex;align-items:center;gap:8px}.remember input{accent-color:var(--wine);width:17px;height:17px}
.or{display:flex;align-items:center;gap:10px;color:#7590a5;font-size:10px;margin:16px 0}.or:before,.or:after{content:"";height:1px;background:#e7eaf0;flex:1}
.google{width:100%;height:43px;border:1px solid #e2e6ec;border-radius:999px;background:#ffffffa8;color:#39516a;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px}.google i{font-size:15px}
.bottom-scenery{height:42px;position:absolute;z-index:1;bottom:0;left:0;right:0;opacity:.75;background:linear-gradient(0deg,#f4a6c4,#fff0f6);clip-path:polygon(0 75%,5% 63%,9% 72%,14% 52%,18% 67%,23% 43%,28% 67%,35% 53%,42% 70%,49% 48%,55% 65%,63% 42%,69% 64%,76% 46%,82% 68%,89% 36%,94% 60%,100% 48%,100% 100%,0 100%)}
.illustration{height:125px;display:grid;place-items:center;position:relative;margin:8px 0 15px}.illustration:before{content:"";position:absolute;width:150px;height:95px;background:linear-gradient(145deg,#fde6ef,#f8d8e7);border-radius:45% 55% 57% 43%/55% 42% 58% 45%;transform:rotate(-7deg)}
.illustration .big-icon{z-index:1;font-size:48px;color:var(--wine);filter:drop-shadow(0 7px 8px #a5003d20);animation:floaty 3s ease-in-out infinite}
.reset-content{text-align:center}.reset-content .intro{max-width:280px;margin:0 auto 20px}.reset-content .field{text-align:left}
.info-box{display:flex;gap:12px;align-items:center;text-align:left;border-radius:16px;background:linear-gradient(110deg,#fbf0f4,#f8eaf0);padding:15px;margin-top:22px;color:#4f647b;font-size:10px;line-height:1.6}.info-box i{font-size:20px;color:#c04471;flex-shrink:0}
.rules{margin-top:14px;background:linear-gradient(110deg,#fbf0f4,#f9eaf1);border-radius:15px;padding:12px 16px;text-align:left;list-style:none;font-size:10px;line-height:1.9;color:#60748a}.rules li i{color:#c04471;margin-right:8px}
@keyframes pageIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(max-width:480px){body{padding:0;background:#fffdfd}.auth-shell{width:100%;min-height:100dvh;border-radius:0;border:0;box-shadow:none}.auth-content{padding:24px 27px 38px}.login-hero{height:250px;padding-top:max(18px,env(safe-area-inset-top))}.login-body{min-height:calc(100dvh - 230px);padding-bottom:max(44px,env(safe-area-inset-bottom))}.reset-shell .auth-content{padding-top:max(20px,env(safe-area-inset-top))}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body><main class="auth-shell reset-shell"><div class="decor top"></div><div class="auth-content"><div class="status"><span>9:41</span><span class="status-icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-full"></i></span></div><div class="back-row"><a class="back" href="reset-password.html" aria-label="Back to reset password"><i class="fa-solid fa-chevron-left"></i></a></div><div class="brand"><span class="brand-mark"><i class="fa-solid fa-landmark"></i></span><div><div class="brand-name">Insti<span>Nexa</span></div><div class="brand-sub">LAUTECH · Ogbomoso</div></div></div><div class="illustration"><i class="fa-solid fa-lock big-icon"></i><span style="position:absolute;z-index:2;background:#f6c7da;width:76px;height:76px;border-radius:50%;opacity:.55"></span><i class="fa-solid fa-lock big-icon" style="position:relative;z-index:3;font-size:38px"></i></div><h1>Create New Password</h1><p class="intro">Your new password must be different from your previous password.</p><form data-form="new-password" novalidate><label class="field"><i class="fa-solid fa-lock"></i><input name="password" type="password" placeholder="New password" minlength="8" autocomplete="new-password" required><button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye-slash"></i></button></label><label class="field"><i class="fa-solid fa-lock"></i><input name="confirm" type="password" placeholder="Confirm new password" minlength="8" autocomplete="new-password" required><button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-regular fa-eye-slash"></i></button></label><button class="primary" type="submit">Reset Password <i class="fa-solid fa-arrow-right"></i></button><div class="form-message" role="status"></div></form><ul class="rules"><li><i class="fa-solid fa-check"></i>At least 8 characters</li><li><i class="fa-solid fa-check"></i>Include a number</li><li><i class="fa-solid fa-check"></i>Include a special character</li></ul></div><div class="decor bottom-left"></div><div class="decor bottom-right"></div></main><script>(()=>{const form=document.querySelector('form'),p=form.elements.password,c=form.elements.confirm;document.querySelectorAll('.toggle-pass').forEach(b=>b.addEventListener('click',()=>{const i=b.parentElement.querySelector('input');i.type=i.type==='password'?'text':'password';b.innerHTML=i.type==='password'?'<i class="fa-regular fa-eye-slash"></i>':'<i class="fa-regular fa-eye"></i>'}));form.addEventListener('submit',e=>{e.preventDefault();const m=form.querySelector('.form-message');if(!form.checkValidity())m.textContent='Use a password with at least 8 characters.';else if(p.value!==c.value)m.textContent='Your passwords do not match.';else if(!/[0-9]/.test(p.value)||!/[!@#$%^&*(),.?":{}|<>_\-+=\[\]\\\/]/.test(p.value))m.textContent='Include at least one number and one special character.';else m.textContent='UI demo only: connect this form to your secure password update endpoint.';m.classList.add('show')})})();</script></body></html>
